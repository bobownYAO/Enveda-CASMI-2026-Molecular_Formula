[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casmi-formula"
version = "0.1.1"
description = "Offline MS/MS molecular formula candidate generation and ranking"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "polars>=1.30", "pyarrow>=18", "rdkit>=2024.9", "lightgbm>=4.5", "numba>=0.61", "psutil>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
casmi = "casmi.cli:main"

[tool.setuptools]
py-modules = ["formula_adapter"]
package-dir = {"" = ".", "casmi" = "src/casmi"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"casmi.formula" = [
    "models/multi/model.txt", "models/multi/metadata.json",
    "models/enveda-only/model.txt", "models/enveda-only/metadata.json",
    "models/manifest.json", "models/README.md",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
