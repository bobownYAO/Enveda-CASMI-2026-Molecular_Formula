[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casmi-formula"
version = "0.1.0"
description = "Offline MS/MS molecular formula candidate generation and ranking"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "polars>=1.30", "pyarrow>=18", "rdkit>=2024.9", "lightgbm>=4.5", "numba>=0.61", "psutil>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
casmi = "casmi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
